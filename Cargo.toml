[package]
name = "canopy"
version = "0.1.0"
edition = "2021"
description = "Google Drive sync for Linux, like Insync (Rust + Qt Quick)"
license = "MIT"
repository = "https://github.com/benwbooth/canopy"

[[bin]]
name = "canopy"
path = "src/main.rs"

[workspace]
members = [".", "core"]
resolver = "2"

[dependencies]
canopy-core = { path = "core" }
anyhow = "1"
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[build-dependencies]
cxx-qt-build = "0.10"

# One optimized, incremental profile for everything (as grove/sheaf).
[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = true

[package]
name = "canopy-core"
version = "0.1.0"
edition = "2021"
description = "canopy's Google Drive sync engine, daemon and API (no Qt)"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "canopyd"
path = "src/bin/canopyd.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
ureq = { version = "2.12", features = ["json", "socks-proxy"] }
oo7 = { version = "0.4", default-features = false, features = ["async-std", "native_crypto"] }
futures-lite = "2"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
inotify = "0.11"
ignore = "0.4"
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
filetime = "0.2"
libc = "0.2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
